<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#583A80" />
    <title>رداء الحشمة</title>
    <meta name="description" content="رداء الحشمة، شراشف وسجاد صلاة بتصاميم سعودية أنيقة." />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/storefront/store.css?v=bundle-purchase-wishlist-20261001-1" />
  </head>
  <body>
    <div id="storeApp">
      <div class="store-loading"><div class="store-loading-visual"><span class="loading-mark"></span><img class="loading-custom-icon" alt="" hidden /></div><p>جاري تجهيز المتجر...</p></div>
      <script>
        fetch('/api/store/loading-icon', { method:'HEAD' }).then(response => {
          if (!response.ok) return;
          const image = document.querySelector('.loading-custom-icon');
          image.onload = () => { image.hidden = false; image.previousElementSibling.hidden = true; };
          image.onerror = () => { image.hidden = true; image.previousElementSibling.hidden = false; };
          image.src = response.url;
        }).catch(() => {});
      </script>
    </div>
    <div id="overlayRoot"></div>
    <div id="toastRoot" aria-live="polite"></div>
    <script src="/storefront/lucide.min.js"></script>
    <script type="module" src="/storefront/store.js?v=bundle-listing-stock-20261001-1"></script>
  </body>
</html>
